[project]
name = "netplay-index"
version = "0.1.0"
description = "Dolphin's NetPlay Index / Lobby Server"
authors = [{ name = "spycrab" }]
requires-python = ">=3.13,<3.14"
license = "GPL-3.0-or-later"
dependencies = [
    "tornado>=6.5.8,<7",
    "bcrypt>=5.0.0,<6",
    "geoip2>=5.3.0,<6",
    "prometheus-client>=0.26.0,<0.27",
]

[project.scripts]
netplay-index = "netplay_index.__main__:main"

[dependency-groups]
dev = [
    "tornado-utils~=1.6",
    "beautifulsoup4>=4.15.0,<5",
    "coveralls>=4.1.0,<5",
    "coverage>=7.15.4,<8",
    "black>=26.5.1,<27",
    "pytest>=9.1.1,<10",
    "pytest-cov>=7.1.0,<8",
]

[build-system]
requires = ["hatchling>=1.32.0,<2"]
build-backend = "hatchling.build"
