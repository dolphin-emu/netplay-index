[project]
name = "netplay-index"
version = "0.1.0"
description = "Dolphin's NetPlay Index / Lobby Server"
authors = [{ name = "spycrab" }]
requires-python = ">=3.10,<3.11"
license = "GPL-3.0-or-later"
dependencies = [
    "tornado>=6.0.2,<7",
    "bcrypt>=3.1.6,<4",
    "geoip2>=2.9.0,<3",
    "prometheus-client>=0.22.1,<0.23",
]

[project.scripts]
netplay-index = "netplay_index.__main__:main"

[dependency-groups]
dev = [
    "tornado-utils~=1.6",
    "beautifulsoup4>=4.6.0,<5",
    "coveralls>=3.3.1,<4",
    "coverage>=6.4.4,<7",
    "black>=22.6.0,<23",
    "pytest>=7.1.2,<8",
    "pytest-cov>=3.0.0,<4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
